# FILE: .github/workflows/cd-order-service.yml
name: CD - Order Service

# Le pipeline se déclenche uniquement si on modifie le code du order-service
on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/order-service/**'
      - '.github/workflows/cd-order-service.yml'

# DEVSECOPS : Permissions strictes. id-token: write est OBLIGATOIRE pour OIDC AWS.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "eu-west-3"
  ECR_REPOSITORY: "atlasflow-order-service"
  # L'ARN de ton rôle IAM créé à la Phase 20 (copié depuis tes captures d'écran)
  ROLE_TO_ASSUME: "arn:aws:iam::190771706930:role/atlasflow-github-actions-role"

jobs:
  build-scan-push:
    name: Build, Scan and Push to ECR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest ./services/order-service

    - name: Run Trivy vulnerability scanner (DevSecOps)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
        format: 'table'
        exit-code: '0' # Fait échouer le pipeline si une faille est trouvée
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Docker image to ECR
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $REGISTRY/$ECR_REPOSITORY:latest