apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        # L'image viendra d'AWS ECR, pas de ton PC
        image: 190771706930.dkr.ecr.eu-west-3.amazonaws.com/atlasflow-order-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        
        # --- INJECTION CLOUD-NATIVE ---
        envFrom:
        - configMapRef:
            name: atlasflow-prod-config
        - secretRef:
            name: atlasflow-prod-secrets