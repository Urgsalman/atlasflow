apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-deployment
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: 190771706930.dkr.ecr.eu-west-3.amazonaws.com/atlasflow-notification-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8002