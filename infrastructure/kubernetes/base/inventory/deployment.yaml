apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-deployment
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: 190771706930.dkr.ecr.eu-west-3.amazonaws.com/atlasflow-inventory-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001